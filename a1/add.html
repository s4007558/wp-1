<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>BookVerse | Add Book</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Elms+Sans:wght@400;500;600;700&family=Righteous&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark"><div class="container">
    <a class="navbar-brand" href="index.html"><span class="material-icons">menu_book</span> BookVerse</a>
    <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#menu" aria-label="Toggle navigation"><span class="navbar-toggler-icon"></span></button>
    <div class="collapse navbar-collapse" id="menu"><ul class="navbar-nav ms-auto">
        <li><a class="nav-link" href="index.html">Home</a></li><li><a class="nav-link" href="books.html">Books</a></li><li><a class="nav-link" href="gallery.html">Gallery</a></li><li><a class="nav-link active" href="add.html">Add Book</a></li>
    </ul></div>
</div></nav>

<main>
    <section class="page-header"><div class="container"><p class="eyebrow">BOOKVERSE COLLECTION</p><h1>Add a Book</h1><p>Complete every required field.</p></div></section>
    <section class="py-5"><div class="container">
        <form id="addBookForm" class="form-card" novalidate>
            <div id="formMessage" class="alert d-none" role="alert"></div>

            <label for="title" class="form-label">Book Title</label>
            <input id="title" name="title" class="form-control mb-3" type="text" placeholder="Enter the book title" required>

            <label for="author" class="form-label">Author Name</label>
            <input id="author" name="author" class="form-control mb-3" type="text" placeholder="Enter the author's name" required>

            <label for="genre" class="form-label">Genre</label>
            <select id="genre" name="genre" class="form-select mb-3" required>
                <option value="">Select a genre</option><option>Fiction</option><option>Fantasy</option><option>Mystery</option><option>Adventure</option><option>Romance</option>
            </select>

            <label for="publication_year" class="form-label">Publication Year</label>
            <input id="publication_year" name="publication_year" class="form-control mb-3" type="number" placeholder="e.g. 2024" min="1000" max="2026" required>

            <label for="isbn" class="form-label">ISBN</label>
            <input id="isbn" name="isbn" class="form-control mb-3" type="text" placeholder="Enter the ISBN" required>

            <label for="description" class="form-label">Description</label>
            <textarea id="description" name="description" class="form-control mb-3" rows="4" placeholder="Enter a short description" required></textarea>

            <label for="book_condition" class="form-label">Book Condition</label>
            <select id="book_condition" name="book_condition" class="form-select mb-3" required>
                <option value="">Select condition</option><option>New</option><option>Gently Used</option><option>Fair</option>
            </select>

            <label for="price" class="form-label">Price</label>
            <input id="price" name="price" class="form-control mb-3" type="number" placeholder="e.g. 25.00" min="0" step="0.01" required>

            <label for="image_path" class="form-label">Upload Cover Image</label>
            <input id="image_path" name="image_path" class="form-control" type="file" accept=".jpg,.jpeg,.png,.gif" required>
            <div class="form-text">Accepted: JPG, JPEG, PNG and GIF.</div>
            <div id="imageError" class="text-danger small" role="alert"></div>
            <img id="imagePreview" class="image-preview d-none mt-3" src="" alt="Selected cover preview">

            <label for="status" class="form-label mt-3">Status</label>
            <select id="status" name="status" class="form-select mb-3" required>
                <option value="">Select status</option><option>Available</option><option>Reserved</option><option>Sold</option>
            </select>

            <div class="form-check mb-3">
                <input id="agree" name="agree" class="form-check-input" type="checkbox" required>
                <label for="agree" class="form-check-label">I agree that this book information is accurate and complete</label>
            </div>

            <button class="btn btn-primary-custom" type="submit">Add Book</button>
        </form>
    </div></section>
</main>

<footer><div class="container d-flex justify-content-between"><p>&copy; 2026 BookVerse</p><p>Joseph Saba</p></div></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/scripts.js"></script>
</body>
</html>
